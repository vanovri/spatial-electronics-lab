name: Android and spatial contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: bash gradlew :app:assembleDebug :app:testDebugUnitTest --console=plain --no-daemon
      - run: node --test tests/geometry.test.mjs
      - run: python3 -m unittest discover -s tests -v
      - run: python3 self_healing_gradle_loop.py --report reports/ci-repair.json --timeout 600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-and-repair-evidence
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/test-results/testDebugUnitTest/
            reports/ci-repair.json
            reports/build-attempt-*.log
